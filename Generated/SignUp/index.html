<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignUp | Wolfs Trucking Co.</title>
<meta name="theme-color" content="#ff6b35">
<link rel="stylesheet" href="/wolfstruckingco.com/css/app.css">
<script>(function(){try{if(!localStorage.getItem("wolfs.theme") && !localStorage.getItem("wolfs_theme")){document.documentElement.setAttribute("data-theme","light");document.documentElement.style.colorScheme="light";}}catch(e){}})();</script></head>
<body>
<div class="TopBar">
  <div class="Brand"><span class="Logo">W</span><a href="/wolfstruckingco.com/">Wolfs — Trucking</a></div>
  <div class="TopActions">
    <a href="/wolfstruckingco.com/About/">About</a>
    <a href="/wolfstruckingco.com/Services/">Services</a>
    <a href="/wolfstruckingco.com/Pricing/">Pricing</a>
    <a href="/wolfstruckingco.com/Marketplace/">Marketplace</a>
    <a href="/wolfstruckingco.com/Login/">Sign In</a>
  </div>
</div>
<div class="LoginWrap"><div class="LoginCard"><div class="LoginBrand">Wolfs Trucking Co.</div>
        <div class="LoginSubtitle">Create your account — email + password is all we need.</div>
        <form action="/"><div class="Field"><label>Email</label>
                <input type="email" id="Form_Email" name="Form.Email" class="valid" value="" /></div>
            <div class="Field"><label>Password</label>
                <input type="password" id="Form_Password" name="Form.Password" class="valid" value="" /></div>
            <button class="Btn" type="submit">Create account</button></form>
        <div class="Divider"><span>or</span></div>
        <a class="Btn Ghost" href="/Login">I already have an account</a></div></div>
</body>
</html>
