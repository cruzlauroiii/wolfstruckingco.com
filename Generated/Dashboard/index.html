<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | Wolfs Trucking Co.</title>
<meta name="theme-color" content="#ff6b35">
<link rel="stylesheet" href="/wolfstruckingco.com/css/app.css">
<script>(function(){try{if(!localStorage.getItem("wolfs.theme") && !localStorage.getItem("wolfs_theme")){document.documentElement.setAttribute("data-theme","light");document.documentElement.style.colorScheme="light";}}catch(e){}})();</script></head>
<body>
<div class="TopBar">
  <div class="Brand"><span class="Logo">W</span><a href="/wolfstruckingco.com/">Wolfs — Trucking</a></div>
  <div class="TopActions">
    <a href="/wolfstruckingco.com/About/">About</a>
    <a href="/wolfstruckingco.com/Services/">Services</a>
    <a href="/wolfstruckingco.com/Pricing/">Pricing</a>
    <a href="/wolfstruckingco.com/Marketplace/">Marketplace</a>
    <a href="/wolfstruckingco.com/Login/">Sign In</a>
  </div>
</div>
<div class="Stage"><h1>Driver Dashboard</h1>
    <p class="Sub">Live job board, accept dispatch, navigate with voice.</p>

    <div class="Stats"><div class="Stat"><div class="Value">0%</div><div class="Label">On-time rate</div></div>
        <div class="Stat"><div class="Value">$0</div><div class="Label">This week</div></div>
        <div class="Stat"><div class="Value">0</div><div class="Label">Completed loads</div></div>
        <div class="Stat"><div class="Value">&#x2014;</div><div class="Label">Rating</div></div></div>

    <div class="Card"><h2>Live map</h2>
        <div id="dashboard-map" class="wt-map" style="width:100%;height:420px"></div></div>

    <div class="Card"><h2>Available jobs</h2><p style="color:var(--text-muted)">No open jobs match your badges right now. Refresh in a minute.</p></div></div>
</body>
</html>
